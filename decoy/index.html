<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XUMENG</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
        Arial, "Microsoft YaHei", sans-serif;
      /* 黑色主题 + 顶部中央冷色辉光，给毛玻璃提供可模糊的"料" */
      background:
        radial-gradient(120% 80% at 50% 28%,
          rgba(94,132,255,0.22) 0%,
          rgba(150,90,230,0.12) 38%,
          rgba(0,0,0,0) 70%),
        #050507;
      color: #e8e8ea;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .stage {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* XUMENG：半透明 iOS 毛玻璃文字，从上亮白渐变到底部冷白蓝，与搜索框同色系融合 */
    .logo {
      font-size: 92px;
      font-weight: 600;
      letter-spacing: 8px;
      margin: 0 0 30px;
      user-select: none;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.98) 0%,
        rgba(205,222,255,0.55) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      filter: drop-shadow(0 2px 22px rgba(120,150,255,0.28));
    }

    /* 搜索框：深色毛玻璃面板，冷白蓝调与 logo 衔接 */
    .search {
      display: flex;
      width: 100%;
      max-width: 720px;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(22px) saturate(150%);
      -webkit-backdrop-filter: blur(22px) saturate(150%);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 34px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.10);
      overflow: hidden;
    }
    .search:focus-within {
      border-color: rgba(150,180,255,0.45);
      box-shadow: 0 10px 50px rgba(80,120,255,0.25), inset 0 1px 0 rgba(255,255,255,0.12);
    }
    .input {
      flex: 1;
      border: none;
      outline: none;
      padding: 20px 30px;
      font-size: 19px;
      color: #f1f1f3;
      background: transparent;
    }
    .input::placeholder { color: rgba(255,255,255,0.40); }
    .btn {
      border: none;
      border-left: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      color: #e8e8ea;
      padding: 0 32px;
      font-size: 18px;
      cursor: pointer;
      transition: background .15s;
    }
    .btn:hover { background: rgba(255,255,255,0.12); }

    .tabs {
      display: flex;
      gap: 8px;
      margin: 30px 0 0;
      flex-wrap: wrap;
      justify-content: center;
    }
    .tab {
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.65);
      padding: 7px 16px;
      border-radius: 18px;
      font-size: 14px;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .tab:hover { background: rgba(255,255,255,0.12); }
    .tab.active {
      background: rgba(120,160,255,0.18);
      border-color: rgba(140,175,255,0.55);
      color: #ffffff;
    }

    .hint {
      margin-top: 16px;
      font-size: 12px;
      color: rgba(255,255,255,0.40);
    }

    footer {
      position: fixed;
      bottom: 14px;
      font-size: 12px;
      color: rgba(255,255,255,0.30);
    }

    /* 不支持 backdrop-filter 的浏览器降级为实色玻璃 */
    @supports not (backdrop-filter: blur(1px)) {
      .search, .tab { background: rgba(255,255,255,0.10); }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="logo">
      <span>X</span><span>U</span><span>M</span><span>E</span><span>N</span><span>G</span>
    </div>

    <form class="search" id="form" autocomplete="off">
      <input type="text" id="q" class="input" placeholder="输入关键词开始搜索…" aria-label="搜索" />
      <button type="submit" class="btn">搜索</button>
    </form>

    <div class="tabs" id="tabs">
      <button type="button" class="tab" data-engine="baidu">Baidu</button>
      <button type="button" class="tab active" data-engine="google">Google</button>
      <button type="button" class="tab" data-engine="bing">Bing</button>
      <button type="button" class="tab" data-engine="yandex">Yandex</button>
    </div>

    <div class="hint" id="hint">当前引擎：Google</div>
  </div>

  <footer>XUMENG Search</footer>

  <script>
    const engines = {
      baidu:  q => 'https://www.baidu.com/s?wd=' + encodeURIComponent(q),
      google: q => 'https://www.google.com/search?q=' + encodeURIComponent(q),
      bing:   q => 'https://www.bing.com/search?q=' + encodeURIComponent(q),
      yandex: q => 'https://yandex.com/search/?text=' + encodeURIComponent(q),
    };
    const labels = { baidu: 'Baidu', google: 'Google', bing: 'Bing', yandex: 'Yandex' };

    let current = 'google';

    const tabs = document.getElementById('tabs');
    const hint = document.getElementById('hint');

    tabs.addEventListener('click', e => {
      const btn = e.target.closest('.tab');
      if (!btn) return;
      current = btn.dataset.engine;
      tabs.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === btn));
      hint.textContent = '当前引擎：' + labels[current];
    });

    document.getElementById('form').addEventListener('submit', e => {
      e.preventDefault();
      const q = document.getElementById('q').value.trim();
      if (!q) return;
      const url = engines[current](q);
      window.open(url, '_blank', 'noopener');
    });
  </script>
</body>
</html>
